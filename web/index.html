<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF6EC">
<title>Belajar Ceria — Prasekolah KSPK</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <header class="topbar">
    <button id="btn-home" class="icon-btn" title="Utama / Home" aria-label="Home">🏠</button>
    <div class="crumb" id="crumb"></div>
    <div class="top-actions">
      <button id="btn-lang" class="pill-btn" aria-label="Tukar bahasa">BM</button>
      <button id="btn-theme" class="icon-btn" title="Mod gelap / Light" aria-label="Theme">🌙</button>
      <button id="btn-sound" class="icon-btn" title="Bunyi / Sound" aria-label="Sound">🔊</button>
      <div class="score-chip" id="score-chip" title="Markah / Score">
        <span id="chip-points">0</span><span class="chip-star">⭐</span>
      </div>
    </div>
  </header>

  <main id="stage"></main>

  <div id="robot-dock">
    <div id="robot-bubble" class="robot-bubble hidden"></div>
    <div id="robot" aria-hidden="true"></div>
  </div>

  <div id="celebrate" class="celebrate hidden"></div>

</div>

<script src="data.js"></script>
<script src="robot.js"></script>
<script src="games.js"></script>
<script src="app.js"></script>
</body>
</html>
